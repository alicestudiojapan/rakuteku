<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ラクテク暮らし リンク集</title>
  <meta name="description" content="ラクテク暮らしの紹介リンク。一人暮らし・共働きの、収納と洗濯の時短。">
  <meta name="theme-color" content="#b8edd1">
  <meta property="og:title" content="ラクテク暮らし リンク集">
  <meta property="og:description" content="一人暮らし・共働きの、収納と洗濯の時短。紹介リンクはプロフィールから。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alicestudiojapan.github.io/rakuteku/">
  <meta property="og:image" content="assets/icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="profile">
      <div class="profile__mark">
        <img class="profile__icon" src="assets/icon.png" width="512" height="512" alt="ラクテク暮らしのアイコン。ミント色の背景に、時計付きの白い家と「ラクテク」の文字。">
      </div>
      <h1 class="profile__name" id="site-name">ラクテク暮らし</h1>
      <p class="profile__handle" id="site-handle">@rakuteku_kurashi</p>
      <p class="profile__tagline" id="site-tagline">一人暮らし・共働きの、収納と洗濯の時短</p>
    </header>

    <nav class="sns" aria-label="SNSをフォロー">
      <h2 class="section-title">SNSをフォロー</h2>
      <div class="sns__links">
        <a class="sns__btn" href="https://www.tiktok.com/@rakuteku_kurashi" target="_blank" rel="noopener">TikTok</a>
        <a class="sns__btn" href="https://www.youtube.com/@rakuteku_kurashi" target="_blank" rel="noopener">YouTube</a>
        <a class="sns__btn" href="https://www.instagram.com/rakuteku_kurashi/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </nav>

    <aside class="notice" id="preparing-banner">
      <p class="notice__text">ただいま準備中です。紹介した商品のリンクは順次追加します</p>
    </aside>

    <main>
      <h2 class="section-title">紹介しているもの</h2>
      <div id="products" class="products"></div>
    </main>

    <footer class="footer" id="footer">
      <p class="footer__pr"><span class="footer__badge">PR</span> 広告を含みます</p>
      <p class="footer__affiliate" id="footer-affiliate"></p>
      <p class="footer__amazon" id="footer-amazon" hidden></p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
